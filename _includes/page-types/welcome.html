<section id="{{ welcome.link.anchor | default: welcome.slug }}" class="container welcome teal">
  <div class="welcome-header">
    <h2 class="welcome-title">{{ welcome.title }}</h2>
  </div>
  <div class="welcome-main">
    <div class="welcome-content">
      {{ welcome.content }}
    </div>
  </div>
  {%- if welcome.stats -%}
  <div class="stats">
    {% include page-types/stats.html
      title=welcome.stats.title
      file=welcome.stats.file
    %}
  </div>
  {%- endif -%}
</section>
